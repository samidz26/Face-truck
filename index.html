<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>اختبار الكاميرا</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        .app {
            width: 100%;
            height: 100%;
            position: relative;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            background: #111;
        }

        .status {
            position: absolute;
            top: 20px;
            left: 15px;
            right: 15px;

            padding: 15px;

            background: rgba(0,0,0,.7);
            color: white;

            border-radius: 15px;
            text-align: center;

            z-index: 5;
        }

        button {
            position: absolute;
            bottom: 30px;
            left: 50%;

            transform: translateX(-50%);

            padding: 15px 30px;

            border: none;
            border-radius: 50px;

            background: white;
            color: black;

            font-size: 17px;
            font-weight: bold;

            z-index: 10;
        }

        button:active {
            transform: translateX(-50%) scale(.95);
        }
    </style>
</head>

<body>

<div class="app">

    <video
        id="camera"
        autoplay
        muted
        playsinline>
    </video>

    <div
        id="status"
        class="status">
        اضغط تشغيل الكاميرا
    </div>

    <button id="start">
        تشغيل الكاميرا
    </button>

</div>


<script>

const video = document.getElementById("camera");
const button = document.getElementById("start");
const status = document.getElementById("status");


button.addEventListener("click", async () => {

    status.textContent = "جاري تشغيل الكاميرا...";

    try {

        if (!navigator.mediaDevices) {

            throw new Error(
                "المتصفح لا يدعم الوصول إلى الكاميرا"
            );
        }


        const stream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode: "user"
                },

                audio: false

            });


        video.srcObject = stream;


        await video.play();


        status.textContent =
            "✓ الكاميرا تعمل بنجاح";


        button.style.display = "none";


    } catch (error) {

        console.error(error);


        status.textContent =
            "خطأ: " + error.name;


        button.textContent =
            "حاول مرة أخرى";


        console.log(
            "Camera error:",
            error
        );

    }

});

</script>

</body>
</html>
