<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Face Tracking</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050505;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .app {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 900px;
            background: #000;
            overflow: hidden;
        }

        /* الكاميرا */
        video {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        /* Canvas فوق الكاميرا */
        canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* لوحة المعلومات */
        .info {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;

            padding: 12px 15px;

            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(10px);

            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 15px;

            color: white;
            direction: rtl;

            z-index: 10;
        }

        .title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .status {
            font-size: 14px;
            color: #00ff88;
            margin-bottom: 8px;
        }

        .values {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            direction: ltr;
        }

        .value {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 7px;
            text-align: center;
            font-size: 12px;
        }

        .value span {
            display: block;
            font-size: 16px;
            font-weight: bold;
            margin-top: 3px;
        }

        /* زر تشغيل الكاميرا */
        .start {
            position: absolute;
            left: 50%;
            bottom: 35px;

            transform: translateX(-50%);

            border: none;
            border-radius: 50px;

            padding: 14px 28px;

            background: white;
            color: black;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            z-index: 20;
        }

        .start:active {
            transform: translateX(-50%) scale(0.95);
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <div class="app">

        <video id="video" autoplay muted playsinline></video>

        <canvas id="canvas"></canvas>

        <div class="info">

            <div class="title">
                Face Tracking
            </div>

            <div id="status" class="status">
                اضغط تشغيل الكاميرا
            </div>

            <div class="values">

                <div class="value">
                    HEAD X
                    <span id="headX">0°</span>
                </div>

                <div class="value">
                    HEAD Y
                    <span id="headY">0°</span>
                </div>

                <div class="value">
                    HEAD Z
                    <span id="headZ">0°</span>
                </div>

            </div>

        </div>

        <button id="startButton" class="start">
            تشغيل الكاميرا
        </button>

    </div>


    <!-- MediaPipe -->
    <script type="module">

        import {
            FaceLandmarker,
            FilesetResolver
        } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22";


        // --------------------------------------------------
        // العناصر
        // --------------------------------------------------

        const video = document.getElementById("video");
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        const startButton =
            document.getElementById("startButton");

        const status =
            document.getElementById("status");

        const headX =
            document.getElementById("headX");

        const headY =
            document.getElementById("headY");

        const headZ =
            document.getElementById("headZ");


        // --------------------------------------------------
        // Face Landmarker
        // --------------------------------------------------

        let faceLandmarker = null;

        let lastVideoTime = -1;


        async function createFaceTracker() {

            status.textContent =
                "جاري تحميل نظام تتبع الوجه...";

            const vision =
                await FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
                );

            faceLandmarker =
                await FaceLandmarker.createFromOptions(
                    vision,
                    {
                        baseOptions: {

                            modelAssetPath:
                                "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",

                            delegate: "GPU"
                        },

                        runningMode: "VIDEO",

                        numFaces: 1,

                        minFaceDetectionConfidence: 0.5,

                        minFacePresenceConfidence: 0.5,

                        minTrackingConfidence: 0.5,

                        outputFaceBlendshapes: true,

                        outputFacialTransformationMatrixes: true
                    }
                );

            status.textContent =
                "نظام تتبع الوجه جاهز";
        }


        // --------------------------------------------------
        // تشغيل الكاميرا
        // --------------------------------------------------

        async function startCamera() {

            try {

                status.textContent =
                    "جاري تشغيل الكاميرا...";

                const stream =
                    await navigator.mediaDevices.getUserMedia({

                        video: {
                            facingMode: "user",
                            width: {
                                ideal: 1280
                            },
                            height: {
                                ideal: 720
                            }
                        },

                        audio: false

                    });

                video.srcObject = stream;

                await video.play();

                startButton.classList.add("hidden");

                resizeCanvas();

                status.textContent =
                    "ابحث عن وجهك...";

                if (!faceLandmarker) {
                    await createFaceTracker();
                }

                requestAnimationFrame(detectFace);

            } catch (error) {

                console.error(error);

                status.textContent =
                    "لم يتم السماح باستخدام الكاميرا";

                startButton.classList.remove("hidden");
            }
        }


        // --------------------------------------------------
        // ضبط Canvas
        // --------------------------------------------------

        function resizeCanvas() {

            canvas.width =
                video.videoWidth || window.innerWidth;

            canvas.height =
                video.videoHeight || window.innerHeight;
        }


        video.addEventListener(
            "loadedmetadata",
            resizeCanvas
        );


        window.addEventListener(
            "resize",
            resizeCanvas
        );


        // --------------------------------------------------
        // رسم نقاط الوجه
        // --------------------------------------------------

        function drawFace(landmarks) {

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            /*
             * MediaPipe يعيد الإحداثيات
             * بين 0 و 1.
             */

            for (const point of landmarks) {

                const x =
                    point.x * canvas.width;

                const y =
                    point.y * canvas.height;


                ctx.beginPath();

                ctx.arc(
                    x,
                    y,
                    1.5,
                    0,
                    Math.PI * 2
                );

                ctx.fillStyle =
                    "#00ff88";

                ctx.fill();
            }
        }


        // --------------------------------------------------
        // حساب اتجاه الرأس
        // --------------------------------------------------

        function calculateHeadDirection(landmarks) {

            /*
             * نقاط تقريبية:
             *
             * 1  = الأنف
             * 33 = زاوية العين
             * 263 = زاوية العين الأخرى
             * 152 = أسفل الوجه
             * 10 = أعلى الوجه
             */

            const nose =
                landmarks[1];

            const leftEye =
                landmarks[33];

            const rightEye =
                landmarks[263];

            const forehead =
                landmarks[10];

            const chin =
                landmarks[152];


            // -----------------------------
            // X
            // -----------------------------

            const eyeCenterX =
                (leftEye.x + rightEye.x) / 2;

            let x =
                (nose.x - eyeCenterX) * 180;


            // -----------------------------
            // Y
            // -----------------------------

            const eyeCenterY =
                (leftEye.y + rightEye.y) / 2;

            const faceHeight =
                chin.y - forehead.y;

            let y =
                ((nose.y - eyeCenterY) /
                    faceHeight) * 180;


            // -----------------------------
            // Z
            // -----------------------------

            const dx =
                rightEye.x - leftEye.x;

            const dy =
                rightEye.y - leftEye.y;

            let z =
                Math.atan2(dy, dx) *
                180 /
                Math.PI;


            /*
             * قلب X لأن الفيديو
             * معكوس مثل المرآة.
             */

            x *= -1;


            // تحديد القيم
            x = Math.max(-90, Math.min(90, x));

            y = Math.max(-90, Math.min(90, y));

            z = Math.max(-90, Math.min(90, z));


            return {
                x,
                y,
                z
            };
        }


        // --------------------------------------------------
        // اكتشاف الوجه
        // --------------------------------------------------

        function detectFace() {

            if (
                !faceLandmarker ||
                video.readyState < 2
            ) {

                requestAnimationFrame(detectFace);

                return;
            }


            if (
                video.currentTime !==
                lastVideoTime
            ) {

                lastVideoTime =
                    video.currentTime;


                const results =
                    faceLandmarker.detectForVideo(
                        video,
                        performance.now()
                    );


                ctx.clearRect(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );


                if (
                    results.faceLandmarks &&
                    results.faceLandmarks.length > 0
                ) {

                    const landmarks =
                        results.faceLandmarks[0];


                    // رسم النقاط
                    drawFace(landmarks);


                    // حساب اتجاه الرأس
                    const direction =
                        calculateHeadDirection(
                            landmarks
                        );


                    headX.textContent =
                        Math.round(direction.x) + "°";

                    headY.textContent =
                        Math.round(direction.y) + "°";

                    headZ.textContent =
                        Math.round(direction.z) + "°";


                    status.textContent =
                        "✓ تم اكتشاف الوجه";


                } else {

                    status.textContent =
                        "لم يتم العثور على وجه";

                }
            }


            requestAnimationFrame(
                detectFace
            );
        }


        // --------------------------------------------------
        // زر التشغيل
        // --------------------------------------------------

        startButton.addEventListener(
            "click",
            startCamera
        );

    </script>

</body>

</html>
